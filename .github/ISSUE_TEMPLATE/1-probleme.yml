name: Signaler un problème
description: Quelque chose ne marche pas, un chiffre semble faux, l'app ne démarre pas.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Ce signalement est public.** N'y mettez jamais de montant, de relevé, de nom de compte ni de capture de vos vraies données. Pour une capture, le profil Démo suffit (Gérer > Profils, ou « Explorer avec la démo » au premier lancement).
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe
      description: Ce que vous voyez, et le message d'erreur s'il y en a un.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire
      description: Les gestes, dans l'ordre. Si possible sur le profil Démo.
      placeholder: |
        1. Ouvrir l'onglet…
        2. Cliquer sur…
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic
      description: |
        Dans l'app : Gérer > Signaler un problème > « Copier le diagnostic », puis coller ici (Ctrl + V). Il ne contient ni montant, ni nom, ni chemin.
        Si l'app ne démarre pas : version de Patrimoine et de Windows ou macOS, et le message affiché.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: donnees
    attributes:
      label: Vos données
      options:
        - label: J'ai relu ce signalement, il ne contient aucun montant, nom de compte, relevé ni capture de mes vraies données.
          required: true
