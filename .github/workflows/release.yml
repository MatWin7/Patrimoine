# Publie une release quand une étiquette de version (v0.2.0...) est poussée (D-121).
# Contrôles d'abord : l'étiquette correspond à app/version.py, CHANGELOG.md a une section pour
# cette version, le commit est sur main, tests et lint passent. Puis : archive du code (fichiers
# suivis par git seulement : ni base, ni .env, ni relevé), empreintes SHA-256, page de release
# avec les notes du journal. Aucune donnée de l'utilisateur n'existe sur la machine de GitHub.
# Patrimoine.exe (D-126) : construit et essayé sous Windows par exe-windows.yml, puis joint à
# la release en dossier zippé (Patrimoine-X.Y.Z-windows.zip), avec son empreinte.
# Patrimoine.app (D-137) : construite et essayée sous macOS par app-macos.yml, jointe en image
# disque (Patrimoine-X.Y.Z-macos.dmg), avec son empreinte.
# Actions figées par empreinte (SHA), comme dans ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Python géré par uv : la dernière version 3.12 publiée (.python-version), téléchargée à chaque
# passage, plutôt que celle installée sur la machine de GitHub, parfois en retard (D-124).
env:
  UV_MANAGED_PYTHON: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }} # passé par variable, jamais collé dans un script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : vérifier que le commit est sur main
          persist-credentials: false # le jeton ne reste pas dans .git/config pendant les tests
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Installer l'environnement (versions figées par uv.lock)
        run: uv sync --locked
      - name: Étiquette, version et journal concordent
        run: uv run python -m app.version --verifier-etiquette "$TAG" --notes "$RUNNER_TEMP/notes.md"
      - name: Commit présent sur main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

  exe-windows:
    needs: controles
    uses: ./.github/workflows/exe-windows.yml

  app-macos:
    needs: controles
    uses: ./.github/workflows/app-macos.yml

  release:
    needs: [controles, exe-windows, app-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # créer la release ; le jeton n'est donné qu'à la dernière étape
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Notes de version
        run: uv sync --locked && uv run python -m app.version --verifier-etiquette "$TAG" --notes "$RUNNER_TEMP/notes.md"
      - name: Récupérer Patrimoine.exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Patrimoine-windows
          path: ${{ runner.temp }}/exe
      - name: Récupérer Patrimoine.app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Patrimoine-macos
          path: ${{ runner.temp }}/mac
      - name: Archive et empreintes
        run: |
          version="${TAG#v}"
          mkdir dist
          git archive --format=zip --prefix="patrimoine-$version/" -o "dist/patrimoine-$version.zip" "$GITHUB_SHA"
          # Garde-fou : aucune base, aucun .env, aucun relevé (CSV, PDF, tableur, OFX) hors fixtures fictives.
          if unzip -Z1 "dist/patrimoine-$version.zip" \
            | grep -E '\.(db|sqlite3?|bak|log|csv|pdf|xlsx?|ods|ofx|qif)$|(^|/)\.env$' \
            | grep -v '/tests/fixtures/'; then
            echo "Fichier interdit dans l'archive" >&2
            exit 1
          fi
          # Patrimoine.exe : le dossier Patrimoine/ zippé tel quel, même garde-fou.
          (cd "$RUNNER_TEMP/exe" && test -f Patrimoine/Patrimoine.exe && zip -q -r -X "$GITHUB_WORKSPACE/dist/Patrimoine-$version-windows.zip" Patrimoine)
          if unzip -Z1 "dist/Patrimoine-$version-windows.zip" \
            | grep -E '\.(db|sqlite3?|bak|log|csv|pdf|xlsx?|ods|ofx|qif)$|(^|/)\.env$'; then
            echo "Fichier interdit dans Patrimoine.exe" >&2
            exit 1
          fi
          # Patrimoine.app : l'image disque construite sous macOS (contenu contrôlé là-bas).
          test -f "$RUNNER_TEMP/mac/Patrimoine-$version-macos.dmg"
          cp "$RUNNER_TEMP/mac/Patrimoine-$version-macos.dmg" dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Patrimoine ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
