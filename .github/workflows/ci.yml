# Relance tests et lint sur GitHub à chaque PR et à chaque push sur main, sous Linux, Windows et
# macOS (D-118) : l'app doit se lancer sans WSL sur chacun.
# Seul le code du dépôt est utilisé : aucune base, aucun .env, aucun appel aux sources de prix
# (les tests simulent le réseau).
# Actions figées par empreinte (SHA) : une étiquette comme v4 peut être déplacée par son auteur,
# l'empreinte désigne un code précis. La version lisible est en commentaire.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Python géré par uv : la dernière version 3.12 publiée (.python-version), téléchargée à chaque
# passage, plutôt que celle installée sur la machine de GitHub, parfois en retard (D-124).
env:
  UV_MANAGED_PYTHON: "1"

jobs:
  tests:
    strategy:
      fail-fast: false # un échec Windows n'arrête pas les autres systèmes
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash # même syntaxe partout (Git Bash sous Windows)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Installer l'environnement (versions figées par uv.lock)
        run: uv sync --locked
      - name: Tests
        run: uv run pytest --durations=15  # les 15 étapes les plus lentes, pour repérer ce qui pèse sous Windows
      - name: Lint
        if: matrix.os == 'ubuntu-latest' # même résultat sur tous les systèmes
        run: uv run ruff check .
      - name: Formatage
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff format --check .
      - name: Syntaxe du front
        if: matrix.os == 'ubuntu-latest'
        run: for f in web/*.js web/app/*.js; do node --check "$f"; done
